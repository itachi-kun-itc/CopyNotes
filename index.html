<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#fafaf9">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://copynotes-bjx.pages.dev; base-uri 'none'; form-action 'self'">
  <meta name="description" content="テキストを入力して、コピー。同じログイン番号で端末間の共有も。">
  <title>CopyNotes</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="app-config.js" defer></script>
  <script src="syntax.js" defer></script>
  <script src="links.js" defer></script>
  <script src="note-limits.js" defer></script>
  <script src="code-editor.js" defer></script>
  <script src="sharing.js" defer></script>
  <script src="auto-sync.js" defer></script>
  <script src="touch-notes.js" defer></script>
  <script src="workspace-tabs.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="notes" aria-label="コピーメモ">
    <header class="toolbar">
      <div class="toolbar-actions">
        <button id="refreshNotes" class="toolbar-button" type="button" title="空白の入力欄を整理">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3v5h-5M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.36-6.36L21 8M3 16l2.64 2.36A9 9 0 0 0 21 12"/></svg>
          更新
        </button>
        <button id="syncNotes" class="toolbar-button" type="button" title="共有タブの変更を送信" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17H5a4 4 0 0 1-.8-7.9A7 7 0 0 1 17.8 8 4.5 4.5 0 0 1 19 17h-2M12 21V11m-4 4 4-4 4 4"/></svg>
          同期
        </button>
      </div>
      <button id="accountButton" class="account-button" type="button" aria-haspopup="dialog" aria-controls="loginDialog">ログイン</button>
    </header>
    <nav class="workspace-tabs" data-active="device" role="tablist" aria-label="メモの保存先">
      <button id="deviceTab" class="workspace-tab" type="button" role="tab" aria-selected="true" aria-controls="notesPanel" tabindex="0">端末</button>
      <button id="sharedTab" class="workspace-tab" type="button" role="tab" aria-selected="false" aria-controls="notesPanel" tabindex="-1">共有</button>
    </nav>
    <section id="notesPanel" role="tabpanel" aria-labelledby="deviceTab">
      <p id="syncStatus" class="sync-status" role="status" aria-live="polite" hidden></p>
      <div id="sharingLogin" class="sharing-login" hidden>
        <p>発行済みのログイン番号で、メモを共有できます。</p>
        <button id="sharingLoginButton" class="toolbar-button" type="button">ログイン</button>
      </div>
      <div class="notes-scroll">
        <div id="noteList" class="note-list"></div>
        <button id="addNote" class="add-button" type="button" aria-label="入力欄を追加" title="入力欄を追加">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </section>
  </main>
  <dialog id="loginDialog" class="login-dialog" aria-labelledby="loginTitle" aria-describedby="loginHelp">
    <form id="loginForm">
      <div class="login-heading"><h1 id="loginTitle">ログイン番号</h1><button id="closeLogin" class="dialog-close" type="button" aria-label="閉じる">×</button></div>
      <p id="loginHelp">発行済みの番号を入力してください。同じ番号の端末で共有できます。</p>
      <div id="loginFields">
      <label class="login-label" for="loginNumber">半角数字5桁</label>
      <input id="loginNumber" class="login-number" name="code" type="text" inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="00000" aria-describedby="loginHelp loginError" required>
      </div>
      <p id="loginError" class="login-error" role="alert"></p>
      <button id="loginSubmit" class="login-submit" type="submit">ログイン</button>
      <button id="logoutButton" class="logout-button" type="button" hidden>ログアウト</button>
    </form>
  </dialog>
  <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="noteMenu" class="note-menu" role="menu" aria-label="入力欄の操作" hidden>
    <button id="deleteNote" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg>
      削除
    </button>
  </div>
  <template id="noteTemplate">
    <div class="note-row">
      <div class="note-editor">
        <pre class="note-highlight" aria-hidden="true"></pre>
        <textarea class="note-input" rows="1" placeholder="テキストを入力…" spellcheck="false"></textarea>
      </div>
      <button class="copy-button" type="button" title="コピー" disabled>
        <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
      </button>
    </div>
  </template>
</body>
</html>
